{% load static %}
<div class="ranch-scenery-banner">
    <div class="ranch-banner-brand">
        <div class="ranch-banner-logo">
            <img src="{% static 'gestor_biologica_monco/img/logo_moncopulli.jpg' %}" alt="Logo Agrícola Moncopulli">
        </div>
        <div class="ranch-banner-text">
            <h4>Agrícola Moncopulli — Parcela &amp; Ganadería</h4>
            <p>Sistema de Gestión Ganadera, Control Reproductivo y Trazabilidad Genética Bovina.</p>
        </div>
    </div>

    <!-- Escena Ilustrada Animada: Pradera, Sol, Nubes, Cercado y Ganado en Pastoreo -->
    <svg class="ranch-svg-scene" viewBox="0 0 900 130" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
        <!-- Sol -->
        <g class="sun-anim">
            <circle cx="820" cy="32" r="22" fill="#fde047" opacity="0.45"/>
            <circle cx="820" cy="32" r="15" fill="#facc15"/>
        </g>

        <!-- Nubes animadas -->
        <g class="cloud-anim-1" fill="#ffffff" opacity="0.88">
            <ellipse cx="480" cy="28" rx="26" ry="11"/>
            <ellipse cx="498" cy="24" rx="18" ry="12"/>
            <ellipse cx="464" cy="26" rx="15" ry="9"/>
        </g>
        <g class="cloud-anim-2" fill="#ffffff" opacity="0.82">
            <ellipse cx="690" cy="22" rx="22" ry="9"/>
            <ellipse cx="706" cy="19" rx="16" ry="10"/>
        </g>

        <!-- Colinas y pradera -->
        <path d="M0,95 Q220,55 460,82 T900,68 L900,130 L0,130 Z" fill="#86efac" opacity="0.75"/>
        <path d="M240,105 Q540,58 900,85 L900,130 L240,130 Z" fill="#4ade80"/>
        <path d="M0,105 Q360,80 900,102 L900,130 L0,130 Z" fill="#22c55e"/>

        <!-- Cercado de madera de la parcela -->
        <g stroke="#78350f" stroke-width="2.2" fill="#92400e" opacity="0.75">
            <line x1="410" y1="82" x2="410" y2="108"/>
            <line x1="445" y1="80" x2="445" y2="106"/>
            <line x1="480" y1="79" x2="480" y2="105"/>
            <line x1="515" y1="80" x2="515" y2="106"/>
            <line x1="405" y1="88" x2="520" y2="86" stroke-width="1.8"/>
            <line x1="405" y1="97" x2="520" y2="95" stroke-width="1.8"/>
        </g>

        <!-- Bovino 1 (Holstein en pastoreo con cuello articulado al cuerpo) -->
        <g transform="translate(575, 62)">
            <rect x="8" y="28" width="4" height="14" rx="1.5" fill="#f8fafc"/>
            <rect x="15" y="28" width="4" height="13" rx="1.5" fill="#cbd5e1"/>
            <rect x="34" y="28" width="4" height="14" rx="1.5" fill="#f8fafc"/>
            <rect x="41" y="28" width="4" height="13" rx="1.5" fill="#cbd5e1"/>
            <rect x="5" y="10" width="44" height="22" rx="9" fill="#ffffff" stroke="#1e293b" stroke-width="1.2"/>
            <path d="M14,11 Q22,12 20,21 Q13,23 11,16 Z" fill="#1e293b"/>
            <path d="M31,12 Q40,14 38,24 Q29,25 30,17 Z" fill="#1e293b"/>
            <ellipse cx="22" cy="31" rx="5" ry="3" fill="#fda4af"/>
            <path class="cow-tail-anim" d="M5,15 Q-2,22 0,29" stroke="#1e293b" stroke-width="1.6" fill="none"/>
            <!-- Cuello y cabeza unidos al tronco (pivote en la base del cuello) -->
            <g class="cow-head-anim-right">
                <path d="M40,11 L49,8 L49,22 L40,22 Z" fill="#ffffff"/>
                <rect x="42" y="7" width="17" height="13" rx="5" fill="#ffffff" stroke="#1e293b" stroke-width="1.2"/>
                <rect x="53" y="13" width="8" height="7" rx="3" fill="#fda4af"/>
                <circle cx="51" cy="11" r="1.5" fill="#1e293b"/>
                <ellipse cx="44" cy="7" rx="3" ry="1.8" fill="#1e293b"/>
            </g>
        </g>

        <!-- Bovino 2 (Hereford en pradera con cuello articulado al cuerpo) -->
        <g transform="translate(715, 66) scale(0.88)">
            <rect x="10" y="28" width="4" height="13" rx="1.5" fill="#7c2d12"/>
            <rect x="17" y="28" width="4" height="12" rx="1.5" fill="#7c2d12"/>
            <rect x="36" y="28" width="4" height="13" rx="1.5" fill="#7c2d12"/>
            <rect x="42" y="28" width="4" height="12" rx="1.5" fill="#7c2d12"/>
            <rect x="8" y="10" width="42" height="21" rx="8" fill="#9a3412" stroke="#431407" stroke-width="1.2"/>
            <path d="M22,11 Q30,13 28,22 Q20,22 21,15 Z" fill="#fef3c7"/>
            <!-- Cuello y cabeza unidos al tronco (pivote en el hombro derecho de la cabeza) -->
            <g class="cow-head-anim-left">
                <path d="M8,11 L15,11 L15,23 L8,22 Z" fill="#9a3412"/>
                <rect x="-2" y="8" width="15" height="12" rx="4.5" fill="#fef3c7" stroke="#431407" stroke-width="1.2"/>
                <rect x="-6" y="13" width="7" height="6" rx="2.5" fill="#fda4af"/>
                <circle cx="4" cy="12" r="1.4" fill="#1e293b"/>
            </g>
        </g>
    </svg>
</div>
